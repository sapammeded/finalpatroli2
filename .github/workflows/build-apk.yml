name: Build STT Professional Security Patrol APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'stt.html'
      - 'package.json'
      - 'scripts/prepare-android.js'
      - 'scripts/android-webview-media.js'
      - 'android-patch/MainActivity.java'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web app and native media bridge
        run: |
          node scripts/prepare-android.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('www/index.html').read_text(encoding='utf-8')
          bridge = Path('scripts/android-webview-media.js').read_text(encoding='utf-8')
          marker = '</head>'
          injection = '<script>\n' + bridge + '\n</script>\n'
          if marker not in html:
              raise SystemExit('STT HTML missing </head> marker')
          html = html.replace(marker, injection + marker, 1)
          Path('www/index.html').write_text(html, encoding='utf-8')
          PY
          printf '%s' '{"appId":"com.stt.professionalsecuritypatrol","appName":"STT Professional Security Patrol","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Android camera and file chooser
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          test -n "$MAIN"
          cp android-patch/MainActivity.java "$MAIN"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          perms=['<uses-permission android:name="android.permission.CAMERA" />']
          insert='\n'.join(perms)+'\n'
          if 'android.permission.CAMERA' not in s:
              s=s.replace('<manifest ', '<manifest ', 1)
              pos=s.find('>')+1
              s=s[:pos]+'\n'+insert+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk STT-Professional-Security-Patrol.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STT-Professional-Security-Patrol-APK
          path: STT-Professional-Security-Patrol.apk
          if-no-files-found: error
          retention-days: 30