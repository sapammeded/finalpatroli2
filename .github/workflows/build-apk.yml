name: Build STT Professional Security Patrol APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'stt.html'
      - 'package.json'
      - 'scripts/prepare-android.js'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web app
        run: |
          mkdir -p www
          cp stt.html www/index.html
          printf '%s' '{"appId":"com.stt.professionalsecuritypatrol","appName":"STT Professional Security Patrol","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk STT-Professional-Security-Patrol.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STT-Professional-Security-Patrol-APK
          path: STT-Professional-Security-Patrol.apk
          if-no-files-found: error
          retention-days: 30